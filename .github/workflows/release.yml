name: 构建与发布

# 任何 push 都无条件跑完整流程，不需要 tag 参与。
# 版本号唯一来源是 package.json，发布说明唯一来源是 RELEASE_NOTE.md。
#
# 这里只负责「构建 + 建 Release + 挂上 vsix」。
# 发到 VS Code 插件市场是手动动作：去市场后台把 Release 里的 .vsix 传上去，原因见 README「发布到插件市场」。
on:
  push:
  workflow_dispatch:

# 建 Release 需要 contents:write
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 本仓库用 bun 做包管理和构建，vsce 的 vscode:prepublish 脚本也调 bun
      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vsce 会调 npm run vscode:prepublish，所以 runner 上还得有 npm
      # vsce 4.x 要求 Node >= 22
      - name: 安装 Node（给 vsce 用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 版本号唯一来源是 package.json（vsce 打包时也是读它），供产物命名、Release 的 tag 与标题用
      - name: 读取 package.json 版本号
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "package.json version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun x tsc --noEmit

      - name: 跑测试
        run: bun test

      - name: 打包 vsix
        run: |
          npx --yes @vscode/vsce@4 package --no-dependencies
          ls -lh ./*.vsix

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: htoj-vscode-${{ steps.version.outputs.version }}
          path: "*.vsix"
          if-no-files-found: error

      # tag 由版本号生成（vX.Y.Z），所以不需要手动打 tag；
      # 同名 Release 已存在时是「更新」而不是重复创建。
      # 发布说明直接从 RELEASE_NOTE.md 读，不用 GitHub 自动生成的。
      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # 不加这个的话 tag 会建在默认分支上，推其它分支时指向的提交可能是错的
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTE.md
          files: "*.vsix"

      # 不在这里发插件市场：
      #   · vsce publish --oidc（GitHub OIDC 可信发布）市场侧返回「Trusted Publishing is not supported」
      #   · vsce publish（PAT）需要 Azure DevOps 组织，而现在建组织必须先绑 Azure 订阅
      # 改为手动：到 https://marketplace.visualstudio.com/manage/publishers/YaoOnion 上传本 Release 里的 .vsix
