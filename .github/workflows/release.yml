name: 构建与发布

# 任何 push 都无条件跑完整流程，不需要 tag 参与。
# 版本号唯一来源是 package.json，发布说明唯一来源是 RELEASE_NOTE.md。
on:
  push:
  workflow_dispatch:

# 创建 Release 需要 contents:write；OIDC 可信发布需要 id-token:write
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 必须锁到 4.0.1-x：4.0.0（当前 latest）做 OIDC 交换时没带 api-version，
      # Marketplace 会回 400「No api-version was supplied」。
      # 修复见 microsoft/vscode-vsce#1337，目前只在预发布通道（npm dist-tag: next）。
      # 等 4.0.1 正式版发布后改回 "@vscode/vsce@4" 即可。
      VSCE: "@vscode/vsce@4.0.1-3"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 本仓库用 bun 做包管理和构建，vsce 的 vscode:prepublish 脚本也调 bun
      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vsce 会调 npm run vscode:prepublish，所以 runner 上还得有 npm
      # vsce 4.x 要求 Node >= 22
      - name: 安装 Node（给 vsce 用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 版本号唯一来源是 package.json（vsce 打包时也是读它），供产物命名、Release 的 tag 与标题用
      - name: 读取 package.json 版本号
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "package.json version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun x tsc --noEmit

      - name: 跑测试
        run: bun test

      - name: 打包 vsix
        run: |
          npx --yes "$VSCE" package --no-dependencies
          ls -lh ./*.vsix

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: htoj-vscode-${{ steps.version.outputs.version }}
          path: "*.vsix"
          if-no-files-found: error

      # tag 由版本号生成（vX.Y.Z），所以不需要手动打 tag；
      # 同名 Release 已存在时是「更新」而不是重复创建。
      # 发布说明直接从 RELEASE_NOTE.md 读，不用 GitHub 自动生成的。
      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          # 不加这个的话 tag 会建在默认分支上，推其它分支时指向的提交可能是错的
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTE.md
          files: "*.vsix"

      # 可信发布：用 GitHub OIDC 换市场的短期凭证，不需要存任何长期 token。
      # 前提：已在市场后台给「本仓库 + 本 workflow 文件名」配好 trusted publishing 策略。
      # --oidc 是 vsce 4.0 才有的；版本锁在 job 级 env 的 $VSCE，原因见那里。
      # 版本号没升就 push 时这步会因「该版本已存在」失败，不想让流水线变红可加 continue-on-error: true
      - name: 发布到 VS Code Marketplace
        run: npx --yes "$VSCE" publish --packagePath htoj-vscode-*.vsix --oidc
