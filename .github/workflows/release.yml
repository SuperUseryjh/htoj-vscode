name: 构建与发布

# 打 tag（v1.0.0 这种）时自动打包并发布；也可以手动跑一次只构建不发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要 contents:write；OIDC 可信发布需要 id-token:write
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 本仓库用 bun 做包管理和构建，vsce 的 vscode:prepublish 脚本也调 bun
      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vsce 会调 npm run vscode:prepublish，所以 runner 上还得有 npm
      # vsce 4.x 要求 Node >= 22
      - name: 安装 Node（给 vsce 用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag 与 package.json 的版本 $version 不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun x tsc --noEmit

      - name: 跑测试
        run: bun test

      - name: 打包 vsix
        run: |
          npx --yes @vscode/vsce@4 package --no-dependencies
          ls -lh ./*.vsix

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      # 可信发布：用 GitHub OIDC 换市场的短期凭证，不需要存任何长期 token。
      # 前提：已在市场后台给「本仓库 + 本 workflow 文件名」配好 trusted publishing 策略。
      # 注意 --oidc 是 vsce 4.0 才有的，所以这里锁 4.x
      - name: 发布到 VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: npx --yes @vscode/vsce@4 publish --packagePath htoj-vscode-*.vsix --oidc
